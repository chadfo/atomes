# Publication du site sur GitHub Pages : à chaque push sur main, le dossier site/ est mis en ligne.
# Prérequis (une fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaqueter le dossier site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
